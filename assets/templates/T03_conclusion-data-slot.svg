<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#172019"/>
  <text x="72" y="132" fill="#b9e44d" font-family="monospace" font-size="30" letter-spacing="4">T03 / CONCLUSION DATA SLOT</text>
  <text x="72" y="260" fill="#f5f7ef" font-family="sans-serif" font-weight="800" font-size="88">一个结论，</text>
  <text x="72" y="355" fill="#f5f7ef" font-family="sans-serif" font-weight="800" font-size="88">不要三套解释。</text>
  <rect x="72" y="465" width="936" height="280" rx="22" fill="#263126" stroke="#9fb37d" stroke-width="3"/>
  <text x="116" y="550" fill="#b9e44d" font-family="monospace" font-size="26">C2 / DATA OR FLOW</text>
  <text x="116" y="690" fill="#f5f7ef" font-family="sans-serif" font-weight="800" font-size="150">3 步</text>
  <text x="500" y="675" fill="#d4ddd0" font-family="sans-serif" font-size="44">输入 → 判断 → 交付</text>
  <rect x="260" y="820" width="560" height="540" rx="280" fill="#39463a" stroke="#8c9a8b" stroke-width="4" stroke-dasharray="12 16"/>
  <text x="540" y="1090" text-anchor="middle" fill="#d1dbd0" font-family="monospace" font-size="30" letter-spacing="3">人物 / 口播安全区</text>
  <rect x="72" y="1430" width="936" height="180" rx="18" fill="#f5f7ef"/>
  <text x="112" y="1540" fill="#172019" font-family="sans-serif" font-size="52">C1 普通字幕只负责让人听懂。</text>
  <text x="72" y="1730" fill="#9caf98" font-family="monospace" font-size="28">主数字必须带单位 · 结论至少停留 1.2–2.0 秒</text>
  <rect x="72" y="1755" width="936" height="105" fill="none" stroke="#e1e9dc" stroke-width="3" stroke-dasharray="14 14"/>
  <text x="540" y="1822" text-anchor="middle" fill="#9caf98" font-family="monospace" font-size="28">平台 UI 预留区</text>
