  <text x="112" y="255" fill="#f6f8f1" font-family="sans-serif" font-weight="800" font-size="92">主题标题放在上方</text>
  <text x="112" y="330" fill="#d2ddd0" font-family="sans-serif" font-size="46">关键词在人物上方，保持阅读顺序</text>
  <rect x="72" y="430" width="270" height="120" rx="18" fill="#b9e44d"/>
  <text x="112" y="507" fill="#172019" font-family="sans-serif" font-weight="800" font-size="62">关键词</text>
  <rect x="230" y="590" width="620" height="720" rx="310" fill="#39463a" stroke="#8c9a8b" stroke-width="4" stroke-dasharray="12 16"/>
  <text x="540" y="930" text-anchor="middle" fill="#d1dbd0" font-family="monospace" font-size="30" letter-spacing="3">人物 / 脸 / 手势安全区</text>
  <rect x="72" y="1400" width="936" height="180" rx="18" fill="#f5f7ef"/>
  <text x="112" y="1510" fill="#172019" font-family="sans-serif" font-size="52">普通口播字幕放在中下方，</text>
